
name: Publish Obsidian with Quartz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Obsidian notes
        uses: actions/checkout@v6
        with:
          path: vault

      - name: Checkout Quartz 5
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build website
        working-directory: quartz
        env:
          SITE_URL: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          npm ci

          npx quartz create \
            --template obsidian \
            --strategy new \
            --baseUrl "$SITE_URL"

        
          # 關閉 Quartz 5 的預設主題
          sed -i '/source: "@quartz-themes\/core"/{n;s/enabled: true/enabled: false/;}' quartz.config.yaml

          # 網站名稱
          sed -i "s/^  pageTitle: .*/  pageTitle: \"Ivy's Emergency Medicine Notes\"/" quartz.config.yaml

          # 安裝其他 Quartz plugins
          npx quartz plugin install --from-config

          # 套用 Oxford Blue & Ice 自訂 CSS
          cp ../vault/.github/quartz/custom.scss quartz/styles/custom.scss


          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.obsidian/' \
            --exclude='.trash/' \
            --exclude='Private/' \
            --exclude='00_個人專案/' \
            --exclude='Obsidian 語法速查表.md' \
            ../vault/ content/

          npx quartz build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      
